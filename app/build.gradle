plugins {
    id 'com.android.application'
}

android {
    namespace 'com.betterxcloud.warzonekbm'
    compileSdk 34

    defaultConfig {
        applicationId "com.betterxcloud.warzonekbm"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "6.7.13-warzone-kbm-v2"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
