plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goydevv.xcloud'
    compileSdk 34

    defaultConfig {
        applicationId "com.goydevv.xcloud"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.0-goyxcloud"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
